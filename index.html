<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Website</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌤️ Weather App</h1>
            <p>Get the latest weather for any city</p>
        </header>

        <div class="search-section">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Enter city name..." 
                class="search-box"
            >
            <button id="searchBtn" class="search-btn">Search</button>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div id="weatherContainer" class="weather-container">
            <div id="currentWeather" class="current-weather hidden">
                <div class="weather-header">
                    <h2 id="cityName"></h2>
                    <p id="weatherDate"></p>
                </div>
                
                <div class="weather-main">
                    <div class="weather-icon">
                        <img id="weatherIcon" src="" alt="weather icon">
                    </div>
                    <div class="weather-details">
                        <div class="temperature">
                            <span id="temperature"></span>
                            <span class="unit">°C</span>
                        </div>
                        <p id="weatherDescription"></p>
                    </div>
                </div>

                <div class="weather-info-grid">
                    <div class="info-box">
                        <span class="label">Feels Like</span>
                        <span class="value" id="feelsLike"></span>
                    </div>
                    <div class="info-box">
                        <span class="label">Humidity</span>
                        <span class="value" id="humidity"></span>
                    </div>
                    <div class="info-box">
                        <span class="label">Wind Speed</span>
                        <span class="value" id="windSpeed"></span>
                    </div>
                    <div class="info-box">
                        <span class="label">Pressure</span>
                        <span class="value" id="pressure"></span>
                    </div>
                </div>
            </div>

            <div id="forecastContainer" class="forecast-container hidden">
                <h3>5-Day Forecast</h3>
                <div id="forecastCards" class="forecast-cards"></div>
            </div>
        </div>

        <footer>
            <p>Powered by <a href="https://openweathermap.org/" target="_blank">OpenWeatherMap API</a></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
